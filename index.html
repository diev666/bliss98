      /* --- Mobile touch fixes (avoid double-tap-to-activate on iOS) --- */
@media (hover:none) and (pointer:coarse){
  /* Prefer immediate activation; avoid iOS “first tap = hover, second tap = click” */
  button, a, input, select, textarea,
  .btn, .menu-item, .ctx-item,
  .games-tab, .games-item, .music-item,
  .blissos-menu-item, .blissos-menu-brand, .blissos-appmenu,
  .wctl, .settings-tab,
  [data-set-theme], [data-set-lang], [data-set-wallpaper], [data-set-animations], [data-set-appopenanim],
  [data-set-scanlines], [data-set-darkmode], [data-set-blissos-darkmode], [data-set-retro],
  [data-set-clock], [data-set-oldcrt], [data-set-os-theme], [data-set-titlebar],
  [data-theme-custom], [data-games-tab], [data-music-id], [data-poem-id], [data-trash-id],
  [data-trash-action], [data-modal-action], [data-menu-action], [data-txt-action], [data-folder-nav-id],
  [data-blissos-action], [data-blissos-open-app], [data-blissos-settings-tab],
  [data-blissos-appmenu-action], [data-blissos-appmenu-app], [data-poetry-action],
  [data-mp-action], [data-mp-pick], [data-videos-action], [data-sound-slider]{
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  /* Make clickable rows feel clickable */
  .menu-item, .ctx-item, .games-tab, .games-item, .music-item{ cursor:pointer; }
}

/* Only apply :hover styles on devices that actually support hover */
@media (hover:hover){
  .menu-item:hover{ background:var(--select); color:var(--select-text); }
  .ctx-item:hover{ background:var(--select); color:var(--select-text); }

  body[data-theme="blissos"] .blissos-menu-item:hover,
  body[data-theme="blissos"] .blissos-menu-brand:hover,
  body[data-theme="blissos"] .blissos-appmenu-drop .menu-item:hover,
  body[data-theme="blissos"] .blissos-apple-menu .menu-item:hover{
    background:var(--blissos-accent);
    color:var(--blissos-accent-contrast);
  }
}

/* Touch feedback without relying on hover */
@media (hover:none) and (pointer:coarse){
  .menu-item:active{ background:var(--select); color:var(--select-text); }
  .ctx-item:active{ background:var(--select); color:var(--select-text); }

  body[data-theme="blissos"] .blissos-menu-item:active,
  body[data-theme="blissos"] .blissos-menu-brand:active,
  body[data-theme="blissos"] .blissos-appmenu-drop .menu-item:active,
  body[data-theme="blissos"] .blissos-apple-menu .menu-item:active{
    background:var(--blissos-accent-2);
    color:var(--blissos-accent-contrast);
  }
  /* Ensure input sliders respond immediately */
  input[type="range"]{
    touch-action: manipulation;
  }
}

      /* --- Mobile UI fit (menubar + dock) --- */
      @media (hover:none) and (pointer:coarse) and (max-width:520px){
        /* BlissOS top menubar */
        .blissos-menubar{
          height:16px;
          padding:0 5px;
          gap:6px;
          font-size:10px;
        }
        .blissos-menu-left{gap:6px;}
        .blissos-menu-right{
          gap:8px;
          font-weight:600;
        }
        .blissos-appmenu{
          padding:0 5px;
          font-size:11px;
        }
        .blissos-appmenu-icon,
        .blissos-appmenu-icon img{
          width:13px; height:13px;
        }
        .blissos-menu-item,
        .blissos-menu-brand{
          padding:0 5px;
        }
        .blissos-menu-brand img{width:12px;height:12px;}
        .blissos-apple-menu{ top:16px; left:6px; }
        body[data-theme="blissos"] .desktop-area{
          inset:16px 0 32px 0;
        }

        /* BlissOS dock */
        .blissos-dock{ left:50%; transform:translateX(-50%); }
        .blissos-dock-inner{
          height:40px;
          padding:3px 5px;
          gap:5px;
          max-width:calc(100vw - 6px);
          overflow-x:auto;
          -webkit-overflow-scrolling:touch;
        }
        .blissos-dock-cap{
          height:36px;
        }
        .blissos-dock-cap.left{ width:14px; }
        .blissos-dock-cap.right{ width:16px; }
        .blissos-dock-item{
          width:36px;
          height:36px;
        }

        /* Bliss98 taskbar (if user switches OS on mobile) */
        .taskbar{
          height:28px;
          padding:2px 4px;
          gap:4px;
        }
        .tray{
          height:22px;
          padding:0 6px;
        }
        .clock{ min-width:56px; }
        .start-menu{ bottom:30px; }
      }

      @media (hover:none) and (pointer:coarse){

        align-items: center;
        gap: 4px;
        cursor: pointer;
        padding: 4px; /* Space for the focus ring */
        border: 1px solid transparent; /* Placeholder for active state border */
        border-radius: 4px;
        transition: all 0.15s ease;
      }
      body[data-theme="blissos"] .settings-block#settingsBlissosAccent .accent-swatch:hover {

      body.scanlines::before{
        content:"";
        position:fixed;
        inset:0;
        background:repeating-linear-gradient(
          0deg,
          rgba(0,0,0,0.15) 0,
          rgba(0,0,0,0.15) 1px,
          rgba(255,255,255,0) 2px,
          rgba(255,255,255,0) 3px
        );
        pointer-events:none;
        z-index:9999;
      }
      @keyframes crtFlicker{
        0%,100%{opacity:0.42;}
        20%{opacity:0.46;}
        40%{opacity:0.39;}
        60%{opacity:0.48;}
        80%{opacity:0.43;}
      }
      @keyframes crtSweep{
        0%{ background-position:center center, 0% 0%, 0 -32%; }
        100%{ background-position:center center, 0% 0%, 0 132%; }
      }
      body.old-crt #desktop{
        filter:saturate(1.12) contrast(1.1) brightness(1) sepia(0.05);
        border-radius:20px / 12px;
        overflow:hidden;
        box-shadow:
          inset 0 0 84px rgba(0,0,0,0.2),
          inset 0 0 14px rgba(255,255,255,0.12);
        transform:perspective(1400px) rotateX(0.55deg) scale(0.995,0.992);
        transform-origin:center center;
      }
      body.old-crt #desktop::before{
        content:"";
        position:absolute;
        inset:0;
        pointer-events:none;
        z-index:9000;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(0,0,0,0.1) 0 1px,
            rgba(255,255,255,0.03) 1px 3px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255,0,0,0.025) 0 1px,
            rgba(0,255,70,0.018) 1px 2px,
            rgba(70,120,255,0.025) 2px 3px
          );
        opacity:0.3;
        animation:crtFlicker 220ms steps(2,end) infinite;
      }
      body.old-crt #desktop::after{
        content:"";
        position:absolute;
        inset:0;
        pointer-events:none;
        z-index:9001;
        background:
          radial-gradient(130% 115% at 50% 50%, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.03) 53%, rgba(0,0,0,0.38) 100%),
          linear-gradient(120deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.03) 28%, rgba(255,255,255,0) 44%),
          linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0) 100%);
        background-repeat:no-repeat;
        background-size:100% 100%, 180% 180%, 100% 20%;
        background-position:center center, 0% 0%, 0 -32%;
        opacity:0.56;
        animation:crtSweep 8s linear infinite;
      }
      @media (max-width: 720px){
        body.old-crt #desktop{
          border-radius:14px / 8px;
          transform:perspective(1200px) rotateX(0.35deg) scale(0.998,0.996);
        }
      }
      .modal{

        align-items:center;

      @keyframes winOpen{
        from{opacity:0; transform:scale(0.98);}
        to{opacity:1; transform:scale(1);}
      }
      @keyframes winClose{
        from{opacity:1; transform:scale(1);}
        to{opacity:0; transform:scale(0.96);}
      }
      @keyframes winMinimize{
        0%{opacity:1; transform:translate(0,0) scale(1);}
        100%{opacity:0.1; transform:translate(var(--min-x, 0px), var(--min-y, 0px)) scale(0.2, 0.15);}
      }
      @keyframes winRestore{
        0%{opacity:0.1; transform:translate(var(--min-x, 0px), var(--min-y, 0px)) scale(0.2, 0.15);}
        100%{opacity:1; transform:translate(0,0) scale(1);}
      }

      @media (max-width: 720px){
