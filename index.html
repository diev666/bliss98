    <script>
      (function(){
        var enabled = true;
        try{
          var raw = localStorage.getItem('bliss98_oldcrt');
          var theme = localStorage.getItem('bliss98_os_theme') || 'bliss98';
          theme = (theme === 'blissos' || theme === 'blissaqua') ? theme : 'bliss98';
          var profilesRaw = localStorage.getItem('bliss98_os_profiles');
          if(profilesRaw){
            var profiles = JSON.parse(profilesRaw);
            var profile = profiles && profiles[theme];
            if(profile && Object.prototype.hasOwnProperty.call(profile, 'oldCrt')){
              enabled = profile.oldCrt !== false;
            } else if(raw !== null){
              enabled = raw !== '0';
            }
          } else if(raw !== null){
            enabled = raw !== '0';
          }
        } catch {}
        document.documentElement.classList.toggle('old-crt', enabled);
      })();
    </script>

      /* --- Mobile touch fixes (avoid double-tap-to-activate on iOS) --- */
@media (hover:none) and (pointer:coarse){
  html, body, #bootScreen, #login, #desktop{
    touch-action: pan-x pan-y;
    overscroll-behavior: none;
  }
  /* Prefer immediate activation; avoid iOS “first tap = hover, second tap = click” */
  button, a, input, select, textarea,
  .btn, .menu-item, .ctx-item,
  .games-tab, .games-item, .music-item,
  .blissos-menu-item, .blissos-menu-brand, .blissos-appmenu,
  .wctl, .settings-tab,
  [data-set-theme], [data-set-lang], [data-set-wallpaper], [data-set-animations], [data-set-appopenanim],
  [data-set-scanlines], [data-set-darkmode], [data-set-fullscreen], [data-set-blissos-darkmode], [data-set-blissos-aqua], [data-toggle-fullscreen], [data-toggle-blissos-darkmode], [data-toggle-blissos-aqua], [data-set-retro],
  [data-set-clock], [data-set-oldcrt], [data-set-os-theme], [data-set-titlebar], [data-set-bliss98-accent],
  [data-theme-custom], [data-games-tab], [data-music-id], [data-poem-id], [data-trash-id],
  [data-trash-action], [data-modal-action], [data-menu-action], [data-txt-action],
  [data-blissos-action], [data-blissos-open-app], [data-blissos-settings-tab],
  [data-blissos-appmenu-action], [data-blissos-appmenu-app], [data-poetry-action],
  [data-mp-action], [data-mp-pick], [data-videos-action], [data-sound-slider]{
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  /* Make clickable rows feel clickable */
  .menu-item, .ctx-item, .games-tab, .games-item, .music-item{ cursor:pointer; }
}

/* Only apply :hover styles on devices that actually support hover */
@media (hover:hover){
  .menu-item:hover{ background:var(--select); color:var(--select-text); }
  .ctx-item:hover{ background:var(--select); color:var(--select-text); }

  body[data-theme="blissos"] .blissos-menu-item:hover,
  body[data-theme="blissos"] .blissos-menu-brand:hover,
  body[data-theme="blissos"] .blissos-appmenu-drop .menu-item:hover,
  body[data-theme="blissos"] .blissos-apple-menu .menu-item:hover{
    background:var(--blissos-accent);
    color:var(--blissos-accent-contrast);
  }
}

/* Touch feedback without relying on hover */
@media (hover:none) and (pointer:coarse){
  .menu-item:active{ background:var(--select); color:var(--select-text); }
  .ctx-item:active{ background:var(--select); color:var(--select-text); }

  body[data-theme="blissos"] .blissos-menu-item:active,
  body[data-theme="blissos"] .blissos-menu-brand:active,
  body[data-theme="blissos"] .blissos-appmenu-drop .menu-item:active,
  body[data-theme="blissos"] .blissos-apple-menu .menu-item:active{
    background:var(--blissos-accent-2);
    color:var(--blissos-accent-contrast);
  }
  /* Ensure input sliders respond immediately */
  input[type="range"]{
    touch-action: manipulation;
  }
}

      .txt-shell{
        --txt-toolbar-scale:1;

        gap:calc(8px * var(--txt-toolbar-scale));

        border:1px solid var(--panel-border);

      .txt-dropdown-trigger{
        width:100%;
        min-height:calc(30px * var(--txt-toolbar-scale));

        content:"";

        right:calc(9px * var(--txt-toolbar-scale));

        height:0;

        clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%);

        content:'';

        height:23px;
        border-radius:5px;
        transform:translate(-50%, -50%);
        border:1px solid rgba(0,0,0,0.28);
        background:linear-gradient(180deg, #d7cebf 0%, #b2a899 100%);
        box-shadow:inset 0 1px 2px rgba(255,255,255,0.35), inset 0 -1px 2px rgba(0,0,0,0.18);

        width:20px;
        height:20px;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        pointer-events:none;
      }
      .ps1-icon svg{
        width:100%;
        height:100%;
        display:block;
        transform-origin:50% 50%;
      }
      .ps1-dpad-corner{
        position:absolute;
        pointer-events:auto;
        user-select:none;
        border:0;
        background:transparent;
        padding:0;
        width:30px;
        height:30px;
        border-radius:0;
        display:flex;
        align-items:center;
        justify-content:center;
        touch-action:none;
        box-shadow:none;
        color:transparent;
        z-index:1;

      .ps1-dpad-corner.ne{ top:0; right:0; }
      .ps1-dpad-corner.se{ bottom:0; right:0; }
      .ps1-dpad-corner.sw{ bottom:0; left:0; }
      .ps1-dpad-corner.nw{ top:0; left:0; }
      .ps1-dpad-corner .ps1-icon{
        display:none;
      }
      .ps1-dpad-corner.ne .ps1-icon-arrow svg{ transform:rotate(45deg); }
      .ps1-dpad-corner.se .ps1-icon-arrow svg{ transform:rotate(135deg); }
      .ps1-dpad-corner.sw .ps1-icon-arrow svg{ transform:rotate(-135deg); }
      .ps1-dpad-corner.nw .ps1-icon-arrow svg{ transform:rotate(-45deg); }
      .ps1-dpad-btn{
        position:absolute;
        width:46px;
        height:46px;

        touch-action:none;
        z-index:2;

      .ps1-dpad-btn::before{
        content:'';
        position:absolute;
        inset:1px;
        border-radius:8px;
        border:1px solid rgba(0,0,0,0.2);
        background:linear-gradient(180deg, rgba(250,247,239,0.95) 0%, rgba(205,194,176,0.97) 100%);
        box-shadow:0 3px 5px rgba(0,0,0,0.18), inset 0 1px 2px rgba(255,255,255,0.55), inset 0 -1px 2px rgba(0,0,0,0.16);
        opacity:1;
        transform:translateY(0);
        transition:transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
      }
      .ps1-dpad-btn .ps1-icon{
        position:relative;
        z-index:1;
        width:15px;
        height:15px;
      }
      .ps1-dpad-btn .ps1-icon-arrow svg{
        filter:drop-shadow(0 1px 0 rgba(255,255,255,0.4));

      .ps1-dpad-btn.up{ top:4px; left:50%; transform:translateX(-50%); }

        transform:translateY(1px);

        content:"";

        inset:0;
        background:repeating-linear-gradient(
          0deg,
          rgba(0,0,0,0.15) 0,
          rgba(0,0,0,0.15) 1px,
          rgba(255,255,255,0) 2px,
          rgba(255,255,255,0) 3px
        );
        pointer-events:none;

      }
      @keyframes crtFlicker{
        0%,100%{opacity:0.42;}
        20%{opacity:0.46;}
        40%{opacity:0.39;}
        60%{opacity:0.48;}
        80%{opacity:0.43;}
      }
      @keyframes crtSweep{
        0%{ background-position:center center, 0% 0%, 0 -32%; }
        100%{ background-position:center center, 0% 0%, 0 132%; }
      }
      html.old-crt,
      html.old-crt body{
        background:#000;
      }
      :is(html.old-crt, body.old-crt) #app{
        filter:saturate(1.12) contrast(1.1) brightness(1) sepia(0.05);
        border-radius:20px / 12px;
        overflow:hidden;
        box-shadow:
          inset 0 0 84px rgba(0,0,0,0.2),
          inset 0 0 14px rgba(255,255,255,0.12);
        transform:perspective(1400px) rotateX(0.55deg) scale(0.995,0.992);
        transform-origin:center center;
      }
      html.old-crt::before{
        content:"";
        position:fixed;
        inset:0;
        pointer-events:none;
        z-index:2147483647;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(0,0,0,0.1) 0 1px,
            rgba(255,255,255,0.03) 1px 3px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(255,0,0,0.025) 0 1px,
            rgba(0,255,70,0.018) 1px 2px,
            rgba(70,120,255,0.025) 2px 3px
          );
        opacity:0.3;
        animation:crtFlicker 220ms steps(2,end) infinite;
      }
      html.old-crt::after{
        content:"";
        position:fixed;
        inset:0;
        pointer-events:none;
        z-index:2147483647;
        background:
          radial-gradient(130% 115% at 50% 50%, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.03) 53%, rgba(0,0,0,0.38) 100%),
          linear-gradient(120deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.03) 28%, rgba(255,255,255,0) 44%),
          linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0) 100%);
        background-repeat:no-repeat;
        background-size:100% 100%, 180% 180%, 100% 20%;
        background-position:center center, 0% 0%, 0 -32%;
        opacity:0.56;
        animation:crtSweep 8s linear infinite;
      }

          border-radius:14px / 8px;
          transform:perspective(1200px) rotateX(0.35deg) scale(0.998,0.996);

    <script>
      (function(){
        var lastTouchEnd = 0;
        function preventMultiTouchZoom(event){
          if(event.touches && event.touches.length > 1){
            event.preventDefault();
          }
        }
        document.addEventListener('touchstart', preventMultiTouchZoom, { passive:false });
        document.addEventListener('touchmove', preventMultiTouchZoom, { passive:false });
        document.addEventListener('touchend', function(event){
          var now = Date.now();
          if(now - lastTouchEnd <= 320){
            event.preventDefault();
          }
          lastTouchEnd = now;
        }, { passive:false });
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(type){
          document.addEventListener(type, function(event){
            event.preventDefault();
          }, { passive:false });
        });
      })();

      (function(){
        document.documentElement.classList.add('booting');
        function restartBootProgress(bootScreen){
          var fill = bootScreen ? bootScreen.querySelector('.boot-progress-fill') : null;
          bootScreen.classList.remove('boot-running');
          if(fill) void fill.offsetWidth;
          bootScreen.classList.add('boot-running');
        }
        window.showBootScreen = function(options){
          var bootScreen = document.getElementById('bootScreen');
          var duration = options && typeof options.duration === 'number' ? options.duration : 3000;
          if(!bootScreen) return Promise.resolve();
          document.documentElement.classList.add('booting');
          bootScreen.classList.remove('hidden');
          restartBootProgress(bootScreen);
          return new Promise(function(resolve){ setTimeout(resolve, duration); });
        };
        window.hideBootScreen = function(){
          var bootScreen = document.getElementById('bootScreen');
          if(!bootScreen) return;
          bootScreen.classList.add('hidden');
          setTimeout(function(){
            if(bootScreen.classList.contains('hidden')){
              bootScreen.classList.remove('boot-running');
              document.documentElement.classList.remove('booting');
            }
          }, 360);
        };
        document.addEventListener('DOMContentLoaded', function(){
          var bootScreen = document.getElementById('bootScreen');
          var login = document.getElementById('login');
          if(!bootScreen || !login) return;

          var minDuration = new Promise(function(resolve){ setTimeout(resolve, 3000); });
          var domReady = new Promise(function(resolve){
            if (document.readyState === 'complete') resolve();
            else window.addEventListener('load', resolve, { once: true });
          });

          Promise.all([minDuration, domReady]).then(function(){
            window.hideBootScreen();
            setTimeout(function(){
              login.style.display = '';
            }, 360);
          });

          login.style.display = 'none';
        });
      })();
    </script>
